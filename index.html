<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Copernicus:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!-- Markdown + sanitizer + code highlighting + math -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/atom-one-light.min.css" id="hljs-light" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/atom-one-dark.min.css" id="hljs-dark" disabled />
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #faf9f5;
    --bg-elevated: #ffffff;
    --sidebar-bg: #f0eee6;
    --sidebar-hover: #e8e6dc;
    --sidebar-active: #e0ddd0;
    --border: #e3e1d4;
    --border-strong: #c8c5b3;
    --text: #1f1e1d;
    --text-muted: #6b6a63;
    --text-subtle: #9a988e;
    --accent: #c96442;
    --accent-hover: #b5573a;
    --accent-soft: #f7e6df;
    --user-bubble: #f0eee6;
    --code-bg: #f4f2eb;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --radius: 12px;
  }
  [data-theme="dark"] {
    --bg: #262624;
    --bg-elevated: #2c2b29;
    --sidebar-bg: #1f1e1d;
    --sidebar-hover: #2a2927;
    --sidebar-active: #34322e;
    --border: #3a3835;
    --border-strong: #4a4845;
    --text: #f0eee6;
    --text-muted: #b5b3a8;
    --text-subtle: #8e8d85;
    --accent: #d97757;
    --accent-hover: #c96442;
    --accent-soft: #3a2f2a;
    --user-bubble: #34322e;
    --code-bg: #1a1918;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  textarea, input, select { font-family: inherit; }
  a { color: var(--accent); }

  .app { display: flex; height: 100vh; width: 100vw; }

  /* === Sidebar === */
  .sidebar {
    width: 264px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    transition: margin-left 0.22s cubic-bezier(.2,.8,.2,1);
  }
  .sidebar.collapsed { margin-left: -264px; }
  .sidebar-header {
    padding: 14px 12px 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
    font-family: 'Copernicus', serif;
    font-weight: 600; font-size: 16px;
    color: var(--text);
    padding: 4px 6px;
  }
  .logo-mark {
    width: 22px; height: 22px;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: var(--sidebar-hover); color: var(--text); }

  .sidebar-actions {
    padding: 0 8px 8px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .nav-btn {
    padding: 9px 10px;
    border-radius: 8px;
    display: flex; align-items: center; gap: 10px;
    font-size: 13.5px;
    color: var(--text);
    transition: background 0.15s;
    width: 100%; text-align: left;
  }
  .nav-btn:hover { background: var(--sidebar-hover); }
  .nav-btn .kbd {
    margin-left: auto;
    font-size: 11px; color: var(--text-subtle);
    font-family: 'JetBrains Mono', monospace;
  }
  .nav-btn.primary { color: var(--accent); }
  .nav-btn.primary:hover { background: var(--accent-soft); }

  .conv-list { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
  .conv-section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-subtle);
    padding: 12px 10px 6px;
    font-weight: 600;
  }
  .conv-item {
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; color: var(--text);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    transition: background 0.12s;
  }
  .conv-item:hover { background: var(--sidebar-hover); }
  .conv-item.active { background: var(--sidebar-active); }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-actions { display: flex; gap: 2px; opacity: 0; }
  .conv-item:hover .conv-actions, .conv-item.active .conv-actions { opacity: 1; }
  .conv-actions .icon-btn { width: 22px; height: 22px; }
  .conv-actions .icon-btn:hover { background: rgba(0,0,0,0.08); color: var(--accent); }
  [data-theme="dark"] .conv-actions .icon-btn:hover { background: rgba(255,255,255,0.08); }

  .sidebar-footer {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
  }
  .footer-btn {
    padding: 8px 10px; border-radius: 8px;
    font-size: 13.5px; color: var(--text);
    display: flex; align-items: center; gap: 10px;
    text-align: left; transition: background 0.12s;
    width: 100%;
  }
  .footer-btn:hover { background: var(--sidebar-hover); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #4caf50; flex-shrink: 0;
  }
  .status-dot.error { background: var(--accent); }
  .user-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: white;
    font-size: 11px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* === Main === */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 52px;
    display: flex; align-items: center;
    padding: 0 14px; gap: 10px;
    flex-shrink: 0;
  }
  .topbar-title {
    font-family: 'Copernicus', serif;
    font-weight: 600; font-size: 15px;
    color: var(--text); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 4px 8px; border-radius: 6px; cursor: text;
  }
  .topbar-title:hover { background: var(--sidebar-hover); }
  .topbar-title.editing {
    cursor: text; outline: 2px solid var(--accent); outline-offset: 0;
    background: var(--bg-elevated);
  }
  .pill {
    padding: 6px 12px; border-radius: 999px;
    font-size: 12.5px; color: var(--text-muted);
    background: transparent; border: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .pill:hover { background: var(--sidebar-hover); color: var(--text); }
  .pill.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat-inner { max-width: 760px; margin: 0 auto; padding: 24px 24px 140px; }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 70vh; text-align: center; gap: 18px;
  }
  .empty-state .star {
    width: 56px; height: 56px; color: var(--accent);
    margin-bottom: 4px;
  }
  .empty-state h1 {
    font-family: 'Copernicus', serif;
    font-weight: 500; font-size: 32px;
    color: var(--text); margin: 0;
    line-height: 1.2;
  }
  .empty-state .accent { color: var(--accent); }
  .empty-state p {
    color: var(--text-muted); margin: 0;
    font-size: 14px; max-width: 480px;
  }
  .suggestion-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    width: 100%; max-width: 560px; margin-top: 8px;
  }
  .suggestion {
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    text-align: left; font-size: 13.5px; color: var(--text);
    background: transparent;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .suggestion:hover { background: var(--sidebar-hover); border-color: var(--accent); }
  .suggestion:active { transform: scale(0.99); }
  .suggestion .label {
    font-size: 11px; color: var(--text-subtle);
    text-transform: uppercase; letter-spacing: 0.4px;
    margin-bottom: 4px; font-weight: 600;
  }

  /* Messages */
  .message {
    display: flex; gap: 14px; margin-bottom: 24px;
    animation: fadeIn 0.25s ease;
    position: relative;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    margin-top: 2px;
  }
  .avatar.user { background: var(--accent); color: white; font-weight: 600; }
  .avatar.assistant {
    background: transparent; color: var(--accent);
  }
  .avatar.assistant svg { width: 24px; height: 24px; }
  .msg-body {
    flex: 1; min-width: 0; line-height: 1.65; font-size: 15px; color: var(--text);
  }
  .msg-body p:first-child { margin-top: 0; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body p { margin: 0 0 12px; }
  .msg-body ul, .msg-body ol { margin: 8px 0 12px; padding-left: 24px; }
  .msg-body li { margin-bottom: 4px; }
  .msg-body h1, .msg-body h2, .msg-body h3 {
    font-family: 'Copernicus', serif; font-weight: 600;
    margin: 18px 0 8px; line-height: 1.3;
  }
  .msg-body h1 { font-size: 22px; }
  .msg-body h2 { font-size: 19px; }
  .msg-body h3 { font-size: 16px; }
  .msg-body a { color: var(--accent); text-underline-offset: 2px; }
  .msg-body strong { font-weight: 600; }
  .msg-body code:not(pre code) {
    background: var(--code-bg);
    padding: 1px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  .msg-body pre {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    overflow-x: auto; margin: 12px 0;
    position: relative;
  }
  .msg-body pre code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; line-height: 1.55;
    background: transparent; padding: 0;
  }
  .copy-btn {
    position: absolute; top: 6px; right: 6px;
    padding: 4px 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; color: var(--text-muted);
    opacity: 0; transition: opacity 0.15s, color 0.15s;
  }
  pre:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--accent); }

  .msg-body blockquote {
    border-left: 3px solid var(--border);
    padding-left: 14px; color: var(--text-muted); margin: 12px 0;
  }
  .msg-body table {
    border-collapse: collapse; margin: 12px 0;
    width: 100%; font-size: 14px;
  }
  .msg-body th, .msg-body td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
  }
  .msg-body th { background: var(--code-bg); font-weight: 600; }
  .msg-body img { max-width: 100%; border-radius: 8px; margin: 8px 0; border: 1px solid var(--border); }

  .message.user .msg-body {
    background: var(--user-bubble);
    border-radius: var(--radius);
    padding: 12px 16px;
  }
  .message.user .msg-body img {
    max-height: 280px; width: auto; display: block; margin: 4px 4px 8px 0;
  }

  /* Action toolbar */
  .msg-toolbar {
    display: flex; gap: 2px;
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .message:hover .msg-toolbar, .message.streaming .msg-toolbar { opacity: 1; }
  .msg-toolbar .icon-btn {
    width: 28px; height: 28px;
    color: var(--text-subtle);
    border-radius: 6px;
  }
  .msg-toolbar .icon-btn:hover { background: var(--sidebar-hover); color: var(--accent); }
  .msg-toolbar .label {
    font-size: 11px; color: var(--text-subtle);
    margin-left: 6px; align-self: center;
  }

  /* Edit mode */
  .edit-area {
    width: 100%; min-height: 80px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 15px; line-height: 1.55;
    resize: vertical; outline: none;
  }
  .edit-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }

  /* Thinking trace */
  .thinking-block {
    margin: 6px 0 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-elevated);
    overflow: hidden;
  }
  .thinking-block summary {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 8px;
    list-style: none;
    user-select: none;
  }
  .thinking-block summary::-webkit-details-marker { display: none; }
  .thinking-block summary:hover { background: var(--sidebar-hover); }
  .thinking-block .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .thinking-block:not([data-active]) .dot { animation: none; opacity: 0.4; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .thinking-block .thinking-content {
    padding: 10px 14px; border-top: 1px solid var(--border);
    font-size: 13px; line-height: 1.6;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    white-space: pre-wrap;
    max-height: 320px; overflow-y: auto;
  }

  /* Token usage */
  .token-usage {
    font-size: 11px; color: var(--text-subtle);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Cursor */
  .cursor {
    display: inline-block; width: 8px; height: 16px;
    background: var(--text);
    vertical-align: text-bottom; margin-left: 2px;
    animation: blink 1s steps(2, start) infinite;
    border-radius: 1px;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* === Composer === */
  .composer-wrap {
    padding: 12px 24px 16px;
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
    flex-shrink: 0;
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 10px 6px;
    box-shadow: var(--shadow-md);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .composer:focus-within { border-color: var(--border-strong); }
  .attachments { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 4px 0; }
  .attachment {
    position: relative;
    width: 64px; height: 64px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--code-bg);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .attachment img { width: 100%; height: 100%; object-fit: cover; }
  .attachment .remove {
    position: absolute; top: 2px; right: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.65); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .attachment .remove:hover { background: var(--accent); }
  .composer textarea {
    width: 100%; border: none; outline: none; background: transparent;
    color: var(--text); font-size: 15px; line-height: 1.5;
    resize: none; max-height: 240px; min-height: 24px;
    padding: 8px 6px;
  }
  .composer textarea::placeholder { color: var(--text-subtle); }
  .composer-actions {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 2px; gap: 8px;
  }
  .composer-actions-left { display: flex; gap: 2px; align-items: center; }
  .composer-actions-right { display: flex; gap: 6px; align-items: center; }
  .send-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s, opacity 0.15s;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn.stop { background: var(--text); }
  .send-btn.stop:hover { background: var(--text-muted); }
  .footer-hint {
    text-align: center; color: var(--text-subtle);
    font-size: 11px; margin-top: 8px;
  }

  /* === Modal === */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 100; animation: fadeIn 0.15s ease;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 92%; max-width: 520px;
    padding: 22px;
    box-shadow: var(--shadow-lg);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 {
    margin: 0 0 4px;
    font-family: 'Copernicus', serif;
    font-weight: 600; font-size: 19px;
  }
  .modal p.muted {
    color: var(--text-muted);
    font-size: 13px; margin: 0 0 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-elevated); color: var(--text);
    font-size: 14px; outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field .hint { font-size: 12px; color: var(--text-subtle); margin-top: 6px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; gap: 10px;
  }
  .toggle-row .desc {
    flex: 1; font-size: 13.5px;
  }
  .toggle-row .desc small {
    display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px;
  }
  .switch {
    position: relative;
    width: 36px; height: 20px;
    background: var(--border-strong);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute;
    width: 16px; height: 16px;
    background: white; border-radius: 50%;
    top: 2px; left: 2px;
    transition: left 0.15s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn {
    padding: 8px 16px; border-radius: 8px;
    font-size: 13.5px; font-weight: 500;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--sidebar-hover); }
  .btn-danger { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn-danger:hover { background: var(--accent); color: white; border-color: var(--accent); }

  /* Command palette */
  .palette {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 92%; max-width: 580px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    margin-top: -10vh;
  }
  .palette-input-wrap {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .palette-input-wrap svg { color: var(--text-muted); flex-shrink: 0; }
  .palette-input {
    flex: 1; border: none; outline: none;
    background: transparent; color: var(--text);
    font-size: 15px;
  }
  .palette-input::placeholder { color: var(--text-subtle); }
  .palette-list { max-height: 50vh; overflow-y: auto; padding: 6px; }
  .palette-section-title {
    font-size: 11px; color: var(--text-subtle);
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 10px 10px 4px; font-weight: 600;
  }
  .palette-item {
    padding: 9px 10px; border-radius: 6px;
    display: flex; align-items: center; gap: 10px;
    font-size: 13.5px; color: var(--text);
    cursor: pointer;
  }
  .palette-item.active { background: var(--sidebar-active); }
  .palette-item svg { color: var(--text-muted); flex-shrink: 0; }
  .palette-item .kbd { margin-left: auto; font-size: 11px; color: var(--text-subtle); font-family: 'JetBrains Mono', monospace; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Mobile */
  @media (max-width: 720px) {
    .sidebar { position: absolute; left: 0; top: 0; bottom: 0; z-index: 50; box-shadow: var(--shadow-lg); }
    .chat-inner, .composer-wrap { padding-left: 14px; padding-right: 14px; }
    .field-row { grid-template-columns: 1fr; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-subtle); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* katex spacing */
  .katex-display { margin: 12px 0; overflow-x: auto; overflow-y: hidden; }
</style>
</head>
<body>
<!-- Star icon used for Claude branding -->

<div class="app">

  <!-- Main -->
  <main class="main">

<!-- Settings Modal -->
<div class="modal-backdrop" id="settingsModal">

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Claude Chat — talks to Anthropic Messages API directly.
   Single file, no build step.
   ============================================================ */

const STORAGE = {
  KEY: 'claudechat.apiKey',
  MODEL: 'claudechat.model',
  SYSTEM: 'claudechat.system',
  CONVS: 'claudechat.conversations',
  ACTIVE: 'claudechat.activeId',
  NAME: 'claudechat.userName',
  THEME: 'claudechat.theme',
  THINKING: 'claudechat.thinking',
};

const MODEL_LABELS = {
  'claude-sonnet-4-5': 'Claude Sonnet 4.5',
  'claude-sonnet-4-0': 'Claude Sonnet 4',
  'claude-opus-4-1': 'Claude Opus 4.1',
  'claude-opus-4-0': 'Claude Opus 4',
  'claude-3-5-haiku-latest': 'Claude Haiku 3.5',
};
const THINKING_MODELS = new Set(['claude-sonnet-4-5', 'claude-opus-4-1', 'claude-opus-4-0']);

// ---------- State ----------
const state = {
  apiKey: localStorage.getItem(STORAGE.KEY) || '',
  model: localStorage.getItem(STORAGE.MODEL) || 'claude-sonnet-4-5',
  system: localStorage.getItem(STORAGE.SYSTEM) || '',
  userName: localStorage.getItem(STORAGE.NAME) || '',
  theme: localStorage.getItem(STORAGE.THEME) || 'system',
  thinking: localStorage.getItem(STORAGE.THINKING) === '1',
  conversations: JSON.parse(localStorage.getItem(STORAGE.CONVS) || '[]'),
  activeId: localStorage.getItem(STORAGE.ACTIVE) || null,
  streaming: false,
  abortCtl: null,
  pendingAttachments: [], // [{dataUrl, mediaType, name}]
};

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

// ---------- Persistence ----------
const saveConvs = () => localStorage.setItem(STORAGE.CONVS, JSON.stringify(state.conversations));
const setActive = id => { state.activeId = id; if (id) localStorage.setItem(STORAGE.ACTIVE, id); else localStorage.removeItem(STORAGE.ACTIVE); render(); };

function newConversation(activate = true) {
  const id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const conv = { id, title: 'New chat', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  state.conversations.unshift(conv);
  if (activate) state.activeId = id;
  saveConvs();
  if (activate) localStorage.setItem(STORAGE.ACTIVE, id);
  render();
  return conv;
}

function getActive() { return state.conversations.find(c => c.id === state.activeId) || null; }

function deleteConversation(id) {
  state.conversations = state.conversations.filter(c => c.id !== id);
  if (state.activeId === id) state.activeId = state.conversations[0]?.id || null;
  saveConvs();
  if (state.activeId) localStorage.setItem(STORAGE.ACTIVE, state.activeId);
  else localStorage.removeItem(STORAGE.ACTIVE);
  render();
}

// ---------- Theme ----------
function applyTheme() {
  const t = state.theme;
  const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('#hljs-light').disabled = dark;
  $('#hljs-dark').disabled = !dark;
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'system') applyTheme(); });

// ---------- Render ----------
function render() {
  renderSidebar();
  renderTopbar();
  renderMessages();
  applyTheme();
}

function renderSidebar() {
  const list = $('#convList');
  list.innerHTML = '';
  if (!state.conversations.length) {
    list.innerHTML = '<div class="conv-section-title">No conversations yet</div>';
  } else {
    const today = [], yesterday = [], older = [];
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const startOfYesterday = startOfToday - 86400000;
    state.conversations.forEach(c => {
      const t = c.updatedAt || c.createdAt;
      if (t >= startOfToday) today.push(c);
      else if (t >= startOfYesterday) yesterday.push(c);
      else older.push(c);
    });
    const addSection = (title, items) => {
      if (!items.length) return;
      const h = document.createElement('div');
      h.className = 'conv-section-title';
      h.textContent = title;
      list.appendChild(h);
      items.forEach(c => {
        const el = document.createElement('div');
        el.className = 'conv-item' + (c.id === state.activeId ? ' active' : '');
        el.innerHTML = `
          <span class="conv-title">${escapeHtml(c.title || 'Untitled')}</span>
          <span class="conv-actions">
            <button class="icon-btn" data-act="rename" title="Rename"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
            <button class="icon-btn" data-act="delete" title="Delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
          </span>`;
        el.addEventListener('click', e => {
          const act = e.target.closest('[data-act]')?.dataset.act;
          if (act === 'delete') {
            if (confirm('Delete this conversation?')) deleteConversation(c.id);
          } else if (act === 'rename') {
            const nt = prompt('Rename conversation:', c.title);
            if (nt && nt.trim()) { c.title = nt.trim(); saveConvs(); render(); }
          } else {
            setActive(c.id);
          }
        });
        list.appendChild(el);
      });
    };
    addSection('Today', today);
    addSection('Yesterday', yesterday);
    addSection('Earlier', older);
  }

  // status / footer name
  const dot = $('#statusDot'); const txt = $('#statusText');
  if (state.apiKey) { dot.classList.remove('error'); txt.textContent = 'API connected'; }
  else { dot.classList.add('error'); txt.textContent = 'No API key — click to add'; }
  $('#userNameLabel').textContent = state.userName ? state.userName : 'Settings';
  $('#userAvatarMini').textContent = (state.userName || 'U').trim().charAt(0).toUpperCase() || 'U';
}

function renderTopbar() {
  const conv = getActive();
  $('#convTitle').textContent = conv ? (conv.title || 'New chat') : 'New chat';
  $('#modelLabel').textContent = MODEL_LABELS[state.model] || state.model;
  // thinking pill
  const tBtn = $('#thinkingBtn');
  if (THINKING_MODELS.has(state.model)) {
    tBtn.style.display = 'flex';
    tBtn.classList.toggle('active', state.thinking);
    $('#thinkingLabel').textContent = state.thinking ? 'Thinking on' : 'Thinking';
  } else {
    tBtn.style.display = 'none';
  }
}

function renderMessages() {
  const inner = $('#chatInner');
  const conv = getActive();
  inner.innerHTML = '';
  if (!conv || !conv.messages.length) {
    renderEmptyState(inner);
    return;
  }
  conv.messages.forEach(m => inner.appendChild(messageEl(m)));
  scrollToBottom();
}

function renderEmptyState(inner) {
  const greet = greeting();
  const name = state.userName ? ', ' + escapeHtml(state.userName) : '';
  inner.innerHTML = `
    <div class="empty-state">
      <span class="star"><svg width="56" height="56"><use href="#star"/></svg></span>
      <h1>${greet}${name}.<br/><span class="accent">How can I help today?</span></h1>
      <div class="suggestion-grid">
        <button class="suggestion" data-prompt="Explain quantum entanglement to a curious 12-year-old.">
          <div class="label">Explain</div>Quantum entanglement, simply
        </button>
        <button class="suggestion" data-prompt="Write a Python function that finds the longest palindromic substring.">
          <div class="label">Code</div>Longest palindromic substring
        </button>
        <button class="suggestion" data-prompt="Draft a friendly email asking my landlord to fix a leaking faucet.">
          <div class="label">Write</div>Email to my landlord
        </button>
        <button class="suggestion" data-prompt="Compare React, Vue, and Svelte for a small team in 2026.">
          <div class="label">Compare</div>React vs Vue vs Svelte
        </button>
      </div>
    </div>`;
  inner.querySelectorAll('.suggestion').forEach(b => {
    b.addEventListener('click', () => {
      $('#composerInput').value = b.dataset.prompt;
      autosize();
      $('#composerInput').focus();
    });
  });
}

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Working late';
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

function messageEl(m) {
  const wrap = document.createElement('div');
  wrap.className = 'message ' + m.role;
  wrap.dataset.id = m.id;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + m.role;
  if (m.role === 'assistant') {
    avatar.innerHTML = '<svg><use href="#star"/></svg>';
  } else {
    avatar.textContent = (state.userName || 'U').trim().charAt(0).toUpperCase() || 'U';
  }

  const body = document.createElement('div');
  body.className = 'msg-body';

  // Render images first if present (user messages with attachments)
  let html = '';
  if (m.role === 'user' && Array.isArray(m.images) && m.images.length) {
    html += m.images.map(img =>
      `<img src="${escapeAttr(img.dataUrl)}" alt="attachment" />`
    ).join('');
  }
  // Thinking trace (for assistant)
  if (m.role === 'assistant' && m.thinking) {
    html += renderThinkingBlock(m.thinking, false);
  }
  html += renderMarkdown(m.content || '');
  // Token usage
  if (m.role === 'assistant' && m.usage) {
    html += `<div class="token-usage">${m.usage.input_tokens} in · ${m.usage.output_tokens} out</div>`;
  }
  body.innerHTML = html;

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'msg-toolbar';
  if (m.role === 'user') {
    toolbar.innerHTML = `
      <button class="icon-btn" data-act="edit" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon-btn" data-act="copy" title="Copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>`;
  } else {
    toolbar.innerHTML = `
      <button class="icon-btn" data-act="copy" title="Copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
      <button class="icon-btn" data-act="regenerate" title="Regenerate"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>`;
  }
  toolbar.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'copy') { navigator.clipboard.writeText(m.content || ''); toast('Copied'); }
    else if (act === 'edit') startEditMessage(m, wrap);
    else if (act === 'regenerate') regenerateFrom(m);
  });
  body.appendChild(toolbar);

  wrap.appendChild(avatar);
  wrap.appendChild(body);

  // KaTeX
  setTimeout(() => renderMath(body), 0);
  return wrap;
}

function renderThinkingBlock(text, active) {
  return `<details class="thinking-block"${active ? ' data-active open' : ''}>
    <summary><span class="dot"></span><span>${active ? 'Thinking…' : 'Thought process'}</span></summary>
    <div class="thinking-content">${escapeHtml(text)}</div>
  </details>`;
}

function renderMarkdown(text) {
  if (!text) return '';
  const dirty = marked.parse(text, { breaks: true, gfm: true });
  const clean = DOMPurify.sanitize(dirty);
  const tmp = document.createElement('div');
  tmp.innerHTML = clean;
  tmp.querySelectorAll('pre code').forEach(block => {
    try { hljs.highlightElement(block); } catch(_) {}
    const pre = block.parentElement;
    if (!pre.querySelector('.copy-btn')) {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(block.textContent || '');
        btn.textContent = 'Copied';
        setTimeout(() => (btn.textContent = 'Copy'), 1200);
      });
      pre.appendChild(btn);
    }
  });
  return tmp.innerHTML;
}

function renderMath(root) {
  if (typeof renderMathInElement !== 'function') return;
  try {
    renderMathInElement(root, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
      ],
      throwOnError: false,
    });
  } catch(_) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function scrollToBottom() {
  const sc = $('#chatScroll');
  sc.scrollTop = sc.scrollHeight;
}

// ---------- Composer ----------
const composer = $('#composerInput');
function autosize() {
  composer.style.height = 'auto';
  composer.style.height = Math.min(composer.scrollHeight, 240) + 'px';
}
composer.addEventListener('input', autosize);
composer.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
$('#sendBtn').addEventListener('click', () => {
  if (state.streaming) abortStreaming();
  else handleSend();
});

function setSendButtonMode(streaming) {
  const btn = $('#sendBtn');
  btn.classList.toggle('stop', streaming);
  btn.title = streaming ? 'Stop (Esc)' : 'Send (Enter)';
  btn.innerHTML = streaming
    ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
}

// ---------- Attachments ----------
$('#attachBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
  Array.from(e.target.files || []).forEach(f => addAttachment(f));
  e.target.value = '';
});

const composerEl = $('#composer');
['dragenter','dragover'].forEach(ev => composerEl.addEventListener(ev, e => { e.preventDefault(); composerEl.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev => composerEl.addEventListener(ev, e => { e.preventDefault(); composerEl.classList.remove('dragover'); }));
composerEl.addEventListener('drop', e => {
  Array.from(e.dataTransfer.files || []).forEach(f => addAttachment(f));
});
composer.addEventListener('paste', e => {
  const items = Array.from(e.clipboardData?.items || []);
  for (const it of items) {
    if (it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) addAttachment(f);
    }
  }
});

async function addAttachment(file) {
  if (!file.type.startsWith('image/')) { toast('Only images are supported'); return; }
  if (file.size > 5 * 1024 * 1024) { toast('Image must be under 5 MB'); return; }
  const dataUrl = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
  state.pendingAttachments.push({ dataUrl, mediaType: file.type, name: file.name });
  renderAttachments();
}

function renderAttachments() {
  const wrap = $('#attachments');
  wrap.innerHTML = '';
  state.pendingAttachments.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'attachment';
    el.innerHTML = `<img src="${escapeAttr(a.dataUrl)}" alt="" /><button class="remove" title="Remove">×</button>`;
    el.querySelector('.remove').addEventListener('click', () => {
      state.pendingAttachments.splice(i, 1);
      renderAttachments();
    });
    wrap.appendChild(el);
  });
}

// ---------- Send / stream ----------
async function handleSend() {
  const text = composer.value.trim();
  const atts = state.pendingAttachments.slice();
  if (!text && !atts.length) return;
  if (state.streaming) return;
  if (!state.apiKey) { openSettings(); return; }

  let conv = getActive();
  if (!conv) conv = newConversation();

  const userMsg = {
    id: 'm_' + Date.now(),
    role: 'user',
    content: text,
    images: atts,
  };
  conv.messages.push(userMsg);
  conv.updatedAt = Date.now();
  if (conv.messages.filter(m => m.role === 'user').length === 1) {
    conv.title = (text || 'Image').slice(0, 60);
  }
  composer.value = ''; autosize();
  state.pendingAttachments = []; renderAttachments();
  saveConvs();
  render();
  await runAssistantTurn(conv);
}

async function runAssistantTurn(conv) {
  const assistantMsg = { id: 'a_' + Date.now(), role: 'assistant', content: '', thinking: '' };
  conv.messages.push(assistantMsg);
  const inner = $('#chatInner');
  if (!inner.querySelector('.message')) renderMessages();
  const el = messageEl(assistantMsg);
  el.classList.add('streaming');
  inner.appendChild(el);
  const bodyEl = el.querySelector('.msg-body');
  bodyEl.innerHTML = '<span class="cursor"></span>';
  scrollToBottom();

  state.streaming = true;
  setSendButtonMode(true);

  try {
    await streamFromAnthropic(conv, assistantMsg, bodyEl);
  } catch (err) {
    if (err.name === 'AbortError') {
      assistantMsg.content += (assistantMsg.content ? '\n\n' : '') + '_(stopped)_';
    } else {
      assistantMsg.content += (assistantMsg.content ? '\n\n' : '') + `**Error:** ${err.message || String(err)}`;
    }
    rerenderAssistant(el, assistantMsg);
  } finally {
    state.streaming = false;
    state.abortCtl = null;
    setSendButtonMode(false);
    el.classList.remove('streaming');
    conv.updatedAt = Date.now();
    saveConvs();
    renderSidebar();
  }
}

function rerenderAssistant(wrapEl, msg) {
  const newEl = messageEl(msg);
  wrapEl.replaceWith(newEl);
}

function abortStreaming() { if (state.abortCtl) state.abortCtl.abort(); }

function buildApiMessages(conv, upToMsg) {
  // upToMsg: include all prior messages except the placeholder we're streaming into
  const out = [];
  for (const m of conv.messages) {
    if (m === upToMsg) break;
    if (m.role !== 'user' && m.role !== 'assistant') continue;
    if (m.role === 'user' && Array.isArray(m.images) && m.images.length) {
      const blocks = [];
      for (const img of m.images) {
        const data = String(img.dataUrl).split(',')[1] || '';
        blocks.push({
          type: 'image',
          source: { type: 'base64', media_type: img.mediaType || 'image/png', data }
        });
      }
      if (m.content) blocks.push({ type: 'text', text: m.content });
      out.push({ role: 'user', content: blocks });
    } else {
      out.push({ role: m.role, content: m.content });
    }
  }
  return out;
}

async function streamFromAnthropic(conv, assistantMsg, bodyEl) {
  const ctl = new AbortController();
  state.abortCtl = ctl;

  const messages = buildApiMessages(conv, assistantMsg);
  const body = {
    model: state.model,
    max_tokens: 8192,
    stream: true,
    messages,
  };
  if (state.system && state.system.trim()) body.system = state.system.trim();
  if (state.thinking && THINKING_MODELS.has(state.model)) {
    body.thinking = { type: 'enabled', budget_tokens: 4000 };
    body.max_tokens = 16000;
  }

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
    signal: ctl.signal,
  });

  if (!resp.ok || !resp.body) {
    const errText = await resp.text().catch(() => '');
    let msg = `HTTP ${resp.status}`;
    try { const j = JSON.parse(errText); if (j.error?.message) msg = j.error.message; }
    catch(_) { if (errText) msg += ': ' + errText.slice(0, 240); }
    throw new Error(msg);
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let textAcc = '';
  let thinkAcc = '';
  let usage = null;
  let activeBlockType = 'text';
  let scheduled = false;

  const flush = () => {
    let html = '';
    if (thinkAcc) html += renderThinkingBlock(thinkAcc, activeBlockType === 'thinking');
    html += renderMarkdown(textAcc);
    if (activeBlockType === 'text') html += '<span class="cursor"></span>';
    bodyEl.innerHTML = html;
    // re-attach toolbar — simpler: skip during streaming, full re-render on done
    scrollToBottom();
    renderMath(bodyEl);
    scheduled = false;
  };
  const scheduleFlush = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(flush);
  };

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n\n')) !== -1) {
      const event = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      const dataLine = event.split('\n').find(l => l.startsWith('data:'));
      if (!dataLine) continue;
      const payload = dataLine.slice(5).trim();
      if (!payload) continue;
      try {
        const j = JSON.parse(payload);
        if (j.type === 'content_block_start') {
          activeBlockType = j.content_block?.type || 'text';
        } else if (j.type === 'content_block_delta') {
          const d = j.delta;
          if (d?.type === 'text_delta') {
            textAcc += d.text;
            assistantMsg.content = textAcc;
            scheduleFlush();
          } else if (d?.type === 'thinking_delta') {
            thinkAcc += d.thinking;
            assistantMsg.thinking = thinkAcc;
            scheduleFlush();
          }
        } else if (j.type === 'message_delta') {
          if (j.usage) usage = { ...(usage || {}), ...j.usage };
        } else if (j.type === 'message_start') {
          if (j.message?.usage) usage = j.message.usage;
        } else if (j.type === 'error') {
          throw new Error(j.error?.message || 'stream error');
        }
      } catch(e) {
        if (e.name !== 'SyntaxError') throw e;
      }
    }
  }

  assistantMsg.content = textAcc;
  assistantMsg.thinking = thinkAcc;
  assistantMsg.usage = usage;
  // Replace the streaming bubble with a fully-rendered one (toolbar etc.)
  const wrap = bodyEl.parentElement;
  rerenderAssistant(wrap, assistantMsg);
  scrollToBottom();
}

// ---------- Edit + regenerate ----------
function startEditMessage(msg, wrapEl) {
  if (state.streaming) return;
  const body = wrapEl.querySelector('.msg-body');
  const original = msg.content;
  body.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'edit-area';
  ta.value = original;
  body.appendChild(ta);
  const actions = document.createElement('div');
  actions.className = 'edit-actions';
  actions.innerHTML = `
    <button class="btn btn-secondary" data-act="cancel">Cancel</button>
    <button class="btn btn-primary" data-act="save">Save & resend</button>`;
  body.appendChild(actions);
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  actions.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'cancel') renderMessages();
    else if (act === 'save') {
      const newText = ta.value.trim();
      if (!newText) return;
      msg.content = newText;
      // truncate everything after this user message
      const conv = getActive();
      const idx = conv.messages.findIndex(x => x.id === msg.id);
      conv.messages = conv.messages.slice(0, idx + 1);
      conv.updatedAt = Date.now();
      saveConvs();
      render();
      runAssistantTurn(conv);
    }
  });
}

function regenerateFrom(assistantMsg) {
  if (state.streaming) return;
  const conv = getActive();
  const idx = conv.messages.findIndex(m => m.id === assistantMsg.id);
  if (idx < 0) return;
  conv.messages = conv.messages.slice(0, idx);
  conv.updatedAt = Date.now();
  saveConvs();
  render();
  runAssistantTurn(conv);
}

// ---------- Conversation rename in place ----------
$('#convTitle').addEventListener('click', () => {
  const conv = getActive();
  if (!conv) return;
  const el = $('#convTitle');
  if (el.classList.contains('editing')) return;
  const cur = conv.title || '';
  el.classList.add('editing');
  el.contentEditable = 'true';
  el.textContent = cur;
  // place caret at end
  const sel = window.getSelection(); const range = document.createRange();
  range.selectNodeContents(el); range.collapse(false);
  sel.removeAllRanges(); sel.addRange(range);
  el.focus();
  const finish = (commit) => {
    el.contentEditable = 'false';
    el.classList.remove('editing');
    if (commit) {
      const v = el.textContent.trim() || 'Untitled';
      conv.title = v;
      saveConvs();
    }
    render();
  };
  const onKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); cleanup(); }
    if (e.key === 'Escape') { finish(false); cleanup(); }
  };
  const onBlur = () => { finish(true); cleanup(); };
  const cleanup = () => { el.removeEventListener('keydown', onKey); el.removeEventListener('blur', onBlur); };
  el.addEventListener('keydown', onKey);
  el.addEventListener('blur', onBlur);
});

// ---------- Settings ----------
function openSettings() {
  $('#apiKeyInput').value = state.apiKey;
  $('#modelSelect').value = state.model;
  $('#systemPromptInput').value = state.system;
  $('#userNameInput').value = state.userName;
  $('#themeSelect').value = state.theme;
  setSwitch($('#thinkingToggle'), state.thinking);
  $('#settingsModal').classList.add('show');
  setTimeout(() => { (state.apiKey ? $('#userNameInput') : $('#apiKeyInput')).focus(); }, 50);
}
function closeSettings() { $('#settingsModal').classList.remove('show'); }

function setSwitch(el, on) { el.classList.toggle('on', !!on); el.dataset.on = on ? '1' : '0'; }
$('#thinkingToggle').addEventListener('click', e => setSwitch(e.currentTarget, e.currentTarget.dataset.on !== '1'));

$('#settingsBtn').addEventListener('click', openSettings);
$('#apiStatusBtn').addEventListener('click', openSettings);
$('#modelBtn').addEventListener('click', openSettings);
$('#thinkingBtn').addEventListener('click', () => {
  state.thinking = !state.thinking;
  localStorage.setItem(STORAGE.THINKING, state.thinking ? '1' : '0');
  renderTopbar();
});
$('#cancelSettings').addEventListener('click', closeSettings);
$('#settingsModal').addEventListener('click', e => { if (e.target.id === 'settingsModal') closeSettings(); });
$('#saveSettings').addEventListener('click', () => {
  state.apiKey = $('#apiKeyInput').value.trim();
  state.model = $('#modelSelect').value;
  state.system = $('#systemPromptInput').value;
  state.userName = $('#userNameInput').value.trim();
  state.theme = $('#themeSelect').value;
  state.thinking = $('#thinkingToggle').dataset.on === '1';
  localStorage.setItem(STORAGE.KEY, state.apiKey);
  localStorage.setItem(STORAGE.MODEL, state.model);
  localStorage.setItem(STORAGE.SYSTEM, state.system);
  localStorage.setItem(STORAGE.NAME, state.userName);
  localStorage.setItem(STORAGE.THEME, state.theme);
  localStorage.setItem(STORAGE.THINKING, state.thinking ? '1' : '0');
  closeSettings();
  render();
  toast('Saved');
});
$('#clearAllBtn').addEventListener('click', () => {
  if (!confirm('Erase all conversations and settings? This cannot be undone.')) return;
  Object.values(STORAGE).forEach(k => localStorage.removeItem(k));
  location.reload();
});

// ---------- Sidebar / new chat ----------
$('#newChatBtn').addEventListener('click', () => { newConversation(); composer.focus(); });
$('#toggleSidebar').addEventListener('click', () => {
  $('#sidebar').classList.add('collapsed');
  $('#openSidebar').style.display = 'flex';
});
$('#openSidebar').addEventListener('click', () => {
  $('#sidebar').classList.remove('collapsed');
  $('#openSidebar').style.display = 'none';
});

// ---------- Command palette ----------
$('#searchBtn').addEventListener('click', openPalette);
function openPalette() {
  $('#paletteModal').classList.add('show');
  $('#paletteInput').value = '';
  renderPalette('');
  setTimeout(() => $('#paletteInput').focus(), 30);
}
function closePalette() { $('#paletteModal').classList.remove('show'); }
$('#paletteModal').addEventListener('click', e => { if (e.target.id === 'paletteModal') closePalette(); });
$('#paletteInput').addEventListener('input', e => renderPalette(e.target.value));
let paletteCursor = 0;
$('#paletteInput').addEventListener('keydown', e => {
  const items = $$('#paletteList .palette-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteCursor = Math.min(items.length - 1, paletteCursor + 1); updatePaletteCursor(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); paletteCursor = Math.max(0, paletteCursor - 1); updatePaletteCursor(items); }
  else if (e.key === 'Enter') { e.preventDefault(); items[paletteCursor]?.click(); }
});
function updatePaletteCursor(items) { items.forEach((it, i) => it.classList.toggle('active', i === paletteCursor)); items[paletteCursor]?.scrollIntoView({ block: 'nearest' }); }

function renderPalette(query) {
  const list = $('#paletteList');
  const q = query.trim().toLowerCase();
  paletteCursor = 0;
  list.innerHTML = '';
  // Commands
  const commands = [
    { label: 'New chat', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>', kbd: '⌘⇧O', run: () => { closePalette(); newConversation(); composer.focus(); } },
    { label: 'Settings', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8 2 2 0 1 1-2.8 2.8 1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2 2 2 0 1 1-2.8-2.8A1.7 1.7 0 0 0 3 14.4 2 2 0 1 1 3 10.4a1.7 1.7 0 0 0 1.2-2.9 2 2 0 1 1 2.8-2.8A1.7 1.7 0 0 0 9.6 3a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2 2 2 0 1 1 2.8 2.8 1.7 1.7 0 0 0-1.2 2.9 2 2 0 1 1 0 4z"/></svg>', kbd: '⌘/', run: () => { closePalette(); openSettings(); } },
    { label: 'Export current chat as Markdown', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>', run: () => { closePalette(); exportCurrentMarkdown(); } },
    { label: 'Toggle theme', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', run: () => { cycleTheme(); closePalette(); } },
  ].filter(c => !q || c.label.toLowerCase().includes(q));

  if (commands.length) {
    const t = document.createElement('div');
    t.className = 'palette-section-title'; t.textContent = 'Actions';
    list.appendChild(t);
    commands.forEach(c => {
      const it = document.createElement('div');
      it.className = 'palette-item';
      it.innerHTML = `${c.icon}<span>${escapeHtml(c.label)}</span>${c.kbd ? `<span class="kbd">${c.kbd}</span>` : ''}`;
      it.addEventListener('click', c.run);
      list.appendChild(it);
    });
  }

  // Conversations
  const matchedConvs = state.conversations.filter(c => !q || (c.title || '').toLowerCase().includes(q) || c.messages.some(m => (m.content || '').toLowerCase().includes(q))).slice(0, 30);
  if (matchedConvs.length) {
    const t = document.createElement('div');
    t.className = 'palette-section-title'; t.textContent = 'Conversations';
    list.appendChild(t);
    matchedConvs.forEach(c => {
      const it = document.createElement('div');
      it.className = 'palette-item';
      it.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${escapeHtml(c.title || 'Untitled')}</span>`;
      it.addEventListener('click', () => { setActive(c.id); closePalette(); });
      list.appendChild(it);
    });
  }
  const items = $$('#paletteList .palette-item');
  if (items[0]) items[0].classList.add('active');
}

function cycleTheme() {
  const order = ['system','light','dark'];
  state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
  localStorage.setItem(STORAGE.THEME, state.theme);
  applyTheme();
  toast(`Theme: ${state.theme}`);
}

// ---------- Export ----------
function exportCurrentMarkdown() {
  const conv = getActive();
  if (!conv) return toast('No conversation to export');
  let md = `# ${conv.title}\n\n_Exported ${new Date().toISOString()}_\n\n`;
  for (const m of conv.messages) {
    md += `## ${m.role === 'user' ? '🧑 You' : '✦ Claude'}\n\n`;
    if (m.role === 'user' && m.images?.length) md += `_(${m.images.length} image${m.images.length > 1 ? 's' : ''} attached)_\n\n`;
    if (m.thinking) md += `<details><summary>Thinking</summary>\n\n${m.thinking}\n\n</details>\n\n`;
    md += (m.content || '') + '\n\n';
  }
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (conv.title || 'chat').replace(/[^a-z0-9-_ ]/gi,'').slice(0,40) + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported');
}

// ---------- Toast ----------
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// ---------- Global keyboard shortcuts ----------
document.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    if ($('#paletteModal').classList.contains('show')) { closePalette(); return; }
    if ($('#settingsModal').classList.contains('show')) { closeSettings(); return; }
    if (state.streaming) { abortStreaming(); return; }
  }
  if (meta && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  else if (meta && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); newConversation(); composer.focus(); }
  else if (meta && e.key === '/') { e.preventDefault(); openSettings(); }
});

// ---------- Init ----------
function init() {
  if (state.activeId && !state.conversations.find(c => c.id === state.activeId)) {
    state.activeId = state.conversations[0]?.id || null;
  }
  applyTheme();
  render();
  autosize();
  if (!state.apiKey) setTimeout(openSettings, 300);
}
init();
</script>
